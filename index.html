<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Free Fire Admin Panel</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#0b0f16;
  color:white;
}

.container{
  width:92%;
  max-width:500px;
  margin:30px auto;
}

.card{
  background:#151b25;
  padding:22px;
  border-radius:16px;
  margin-top:20px;
  border:1px solid #283242;
}

h1,h2{text-align:center}

label{
  display:block;
  margin:14px 0 7px;
  color:#d1d5db;
}

input,select{
  width:100%;
  padding:13px;
  border-radius:9px;
  border:1px solid #374151;
  background:#0b0f16;
  color:white;
  font-size:16px;
}

button{
  width:100%;
  padding:14px;
  margin-top:18px;
  border:0;
  border-radius:9px;
  background:#22c55e;
  color:white;
  font-size:16px;
  font-weight:bold;
}

.logout{
  background:#dc2626;
}

.copy{
  background:#374151;
}

.key{
  margin-top:15px;
  padding:14px;
  background:#0b0f16;
  border:1px dashed #4b5563;
  border-radius:9px;
  text-align:center;
  word-break:break-all;
  font-weight:bold;
}

.keyItem{
  background:#0b0f16;
  padding:14px;
  margin-top:10px;
  border-radius:9px;
  word-break:break-all;
}

.status{
  color:#22c55e;
  font-weight:bold;
}

.error{
  color:#ef4444;
  text-align:center;
  margin-top:12px;
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<!-- LOGIN -->

<div class="container" id="loginPage">

  <div class="card">

    <h1>🔐 Admin Login</h1>

    <label>Username</label>

    <input
      id="username"
      type="text"
      placeholder="Enter username"
    >

    <label>Password</label>

    <input
      id="password"
      type="password"
      placeholder="Enter password"
    >

    <button onclick="login()">
      Login
    </button>

    <div id="error" class="error"></div>

  </div>

</div>


<!-- ADMIN PANEL -->

<div class="container hidden" id="adminPage">

  <h1>🔥 Free Fire Panel</h1>

  <p style="text-align:center;color:#9ca3af">
    Admin Dashboard
  </p>

  <div class="card">

    <h2>🔑 Generate Key</h2>

    <label>Key Prefix</label>

    <input
      id="prefix"
      value="FF"
      placeholder="Key prefix"
    >

    <label>Duration</label>

    <select id="duration">

      <option value="1">1 Day</option>

      <option value="7">7 Days</option>

      <option value="30">30 Days</option>

      <option value="365">1 Year</option>

    </select>

    <button onclick="generateKey()">
      Generate Key
    </button>

    <div id="newKey"></div>

  </div>


  <div class="card">

    <h2>📋 Generated Keys</h2>

    <div id="keys">

      <p style="color:#777;text-align:center">
        No keys generated
      </p>

    </div>

  </div>


  <button class="logout" onclick="logout()">
    🚪 Logout
  </button>

</div>


<script>

const ADMIN_USERNAME = "admin";
const ADMIN_PASSWORD = "1234";

let keys = [];


function login(){

  const username =
    document.getElementById("username").value;

  const password =
    document.getElementById("password").value;

  if(
    username === ADMIN_USERNAME &&
    password === ADMIN_PASSWORD
  ){

    document
      .getElementById("loginPage")
      .classList.add("hidden");

    document
      .getElementById("adminPage")
      .classList.remove("hidden");

  }else{

    document
      .getElementById("error")
      .textContent =
      "❌ Wrong username or password";

  }

}


function logout(){

  document
    .getElementById("adminPage")
    .classList.add("hidden");

  document
    .getElementById("loginPage")
    .classList.remove("hidden");

  document.getElementById("username").value="";
  document.getElementById("password").value="";

}


function randomText(length){

  const chars =
  "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";

  let result="";

  for(let i=0;i<length;i++){

    result += chars[
      Math.floor(Math.random()*chars.length)
    ];

  }

  return result;

}


function generateKey(){

  const prefix =
    document
    .getElementById("prefix")
    .value
    .trim()
    .toUpperCase() || "FF";

  const days =
    document.getElementById("duration").value;

  const key =
    prefix + "-" +
    randomText(4) + "-" +
    randomText(4) + "-" +
    randomText(4);

  const expiry =
    new Date(
      Date.now() +
      days * 24 * 60 * 60 * 1000
    ).toLocaleDateString();

  keys.push({
    key:key,
    expiry:expiry
  });

  document.getElementById("newKey").innerHTML =
  `
    <div class="key">${key}</div>

    <button
      class="copy"
      onclick="copyKey('${key}')">
      📋 Copy Key
    </button>
  `;

  showKeys();

}


function showKeys(){

  const box =
    document.getElementById("keys");

  if(keys.length === 0){

    box.innerHTML =
    `<p style="color:#777;text-align:center">
      No keys generated
    </p>`;

    return;

  }

  box.innerHTML="";

  keys.forEach((item,index)=>{

    box.innerHTML +=
    `
      <div class="keyItem">

        <b>${item.key}</b>

        <br><br>

        Expiry: ${item.expiry}

        <br><br>

        Status:
        <span class="status">ACTIVE</span>

        <button
          onclick="copyKey('${item.key}')"
          class="copy">
          📋 Copy
        </button>

        <button
          onclick="deleteKey(${index})"
          style="background:#dc2626">
          🗑️ Delete
        </button>

      </div>
    `;

  });

}


function deleteKey(index){

  keys.splice(index,1);

  showKeys();

}


function copyKey(key){

  navigator.clipboard.writeText(key);

  alert("✅ Key copied!");

}

</script>

</body>
</html>
